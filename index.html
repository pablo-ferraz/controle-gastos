<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="App pessoal para registrar gastos e acompanhar por categoria." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <title>Controle de Gastos</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('controle-gastos:theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* localStorage indisponível (modo privado, etc.) — segue com o tema padrão do sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
